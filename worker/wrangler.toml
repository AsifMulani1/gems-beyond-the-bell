# Beyond the Bell, served at gemseducationindia.com/beyond-the-bell
#
# The same pattern the eleven campus sites use: one Worker, one route.
# Cloudflare matches the most specific route, so this wins over the main site's
# gemseducationindia.com/* and the brand site is never touched.
#
#   python3 build.py --live
#   npx wrangler deploy --config worker/wrangler.toml
#
# dist/ nests the files under beyond-the-bell/ because Cloudflare serves the
# asset directory from the root of the zone.

name = "gems-beyond-the-bell"
main = "index.js"
compatibility_date = "2026-10-07"
account_id = "46b37a5f6f3868f57758d05a465e7ede"

[assets]
directory = "../dist"
binding = "ASSETS"

[[routes]]
pattern = "gemseducationindia.com/beyond-the-bell*"
zone_name = "gemseducationindia.com"
